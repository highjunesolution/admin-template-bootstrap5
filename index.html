<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Real-Time Your Money</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="d-flex flex-column min-vh-100 gap-2">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center py-4">
          <div class="">
            <h2 class="text-danger bg-danger-subtle fw-bolder p-2 rounded-3">
              Company
            </h2>
            <p class="fw-bold text-center">123</p>
          </div>
          <div>
            <h3>Real-Time Your Money</h3>
          </div>
          <div>
            <h3 id="display-date">Date</h3>
            <h3 id="display-time">Time</h3>
          </div>
        </div>
      </div>
      <div class="flex-fill">
        <div class="container">
          <!-- Chart -->
          <div class="row g-2 g-md-3">

            <div class="col-12">
              <div class="card h-100 d-flex flex-column">
                <div class="card-header bg-white">
                  <h4 class="fs-5 my-auto">Real Time Chart</h4>
                </div>

                <div class="card-body flex-fill position-relative">
                  <canvas id="realtimeChart"></canvas>
                </div>
              </div>
            </div>
          </div>
          <!-- End of Chart -->
        </div>
      </div>
      <div class="bg-white">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center py-2">
            <div class="text-black d-none d-sm-block">tvshow</div>
            <div class="bg-secondary text-black px-2 py-1">
              Company Co., Ltd.
            </div>
            <div class="text-black">Please contact Highjunesolution</div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="script.js"></script>
  </body>
</html>
